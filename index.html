<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Pokedex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f4f6; 
            color: #1f2937;
            position: relative;
            min-height: 100vh;
        }

        /* Background Image with 25% Opacity */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://input-file-url-here.com/your-image.png'); /* Replace with your actual image URL */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.25;
            z-index: -1;
        }

        .poke-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; background: rgba(255, 255, 255, 0.9); }
        .poke-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        .type-pill { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; font-weight: bold; color: white; text-transform: uppercase; margin: 2px; text-shadow: 1px 1px 1px rgba(0,0,0,0.1); }
        
        .suggestions-list { position: absolute; z-index: 50; top: 100%; left: 0; right: 0; background: white; border-radius: 0 0 12px 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-height: 250px; overflow-y: auto; border: 1px solid #e5e7eb; border-top: none; }
        .suggestions-item { padding: 10px 16px; cursor: pointer; text-transform: capitalize; border-bottom: 1px solid #f3f4f6; }
        .suggestions-item:hover { background-color: #eff6ff; color: #2563eb; }
        
        .stat-bar-bg { background: #e5e7eb; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .stat-bar { height: 100%; width: 0; transition: width 1s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        
        /* Type Colors */
        .type-normal { background-color: #A8A77A; } .type-fire { background-color: #EE8130; }
        .type-water { background-color: #6390F0; } .type-electric { background-color: #F7D02C; }
        .type-grass { background-color: #7AC74C; } .type-ice { background-color: #96D9D6; }
        .type-fighting { background-color: #C22E28; } .type-poison { background-color: #A33EA1; }
        .type-ground { background-color: #E2BF65; } .type-flying { background-color: #A98FF3; }
        .type-psychic { background-color: #F95587; } .type-bug { background-color: #A6B91A; }
        .type-rock { background-color: #B6A136; } .type-ghost { background-color: #735797; }
        .type-dragon { background-color: #6F35FC; } .type-dark { background-color: #705746; }
        .type-steel { background-color: #B7B7CE; } .type-fairy { background-color: #D685AD; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="w-full max-w-6xl mx-auto p-6 bg-white/90 backdrop-blur-md rounded-3xl shadow-sm flex flex-col gap-6 mb-10 border border-gray-100">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-4xl font-black text-gray-900 tracking-tight">Pokédex</h1>
                <p class="text-gray-400 text-sm font-medium">Search across 1000+ Pokémon</p>
            </div>
            <button id="clearFiltersBtn" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl text-sm font-bold hover:bg-red-100 transition-colors">Reset Filters</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="relative group">
                <input id="pokemonSearchInput" type="text" placeholder="Name or ID..." class="w-full p-4 bg-gray-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-blue-500 transition-all outline-none">
                <div id="pokemonSuggestions" class="suggestions-list hidden"></div>
            </div>
            <div class="relative">
                <input id="moveSearchInput" type="text" placeholder="Move (e.g. Thunderbolt)..." class="w-full p-4 bg-gray-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-blue-500 transition-all outline-none">
                <div id="moveSuggestions" class="suggestions-list hidden"></div>
            </div>
            <div class="relative" id="typeFilterContainer">
                <button id="typeFilterButton" class="w-full p-4 bg-gray-50 border-2 border-transparent rounded-2xl flex justify-between items-center hover:bg-gray-100 transition-all outline-none">
                    <span id="typeFilterButtonText" class="font-medium text-gray-600">All Types</span>
                    <svg class="w-5 h-5 text-gray-400 transition-transform" id="typeFilterArrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div id="typeFilterDropdown" class="hidden absolute top-[calc(100%+8px)] left-0 right-0 z-50 bg-white border border-gray-100 rounded-2xl shadow-2xl p-4 grid grid-cols-2 gap-2 max-h-72 overflow-y-auto"></div>
            </div>
        </div>
    </header>

    <main class="w-full max-w-6xl mx-auto">
        <div id="loadingIndicator" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-[6px] border-blue-500 border-t-transparent"></div>
            <p class="mt-4 text-gray-400 font-bold animate-pulse text-white drop-shadow-md">Scanning Database...</p>
        </div>
        <div id="pokemonList" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
    </main>

    <footer id="pagination" class="flex justify-center items-center py-12 gap-6">
        <button id="prevBtn" class="group px-6 py-3 bg-white/90 border-2 rounded-2xl font-bold hover:border-blue-500 transition-all disabled:opacity-30">
            <span class="group-hover:text-blue-500 transition-colors">← Prev</span>
        </button>
        <span id="pageInfo" class="text-sm font-black text-gray-600 uppercase tracking-widest drop-shadow-sm bg-white/50 px-4 py-2 rounded-full"></span>
        <button id="nextBtn" class="group px-6 py-3 bg-white/90 border-2 rounded-2xl font-bold hover:border-blue-500 transition-all disabled:opacity-30">
            <span class="group-hover:text-blue-500 transition-colors">Next →</span>
        </button>
    </footer>

    <div id="modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-900/80 hidden p-4 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] w-full max-w-md overflow-hidden relative shadow-2xl">
            <button id="closeModal" class="absolute top-6 right-6 z-10 bg-white/80 hover:bg-white p-2 rounded-full shadow-lg text-gray-800">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

<script>
    const API = 'https://pokeapi.co/api/v2';
    let currentOffset = 0;
    const LIMIT = 20;
    let allPokemonNames = [];
    let allMoveNames = [];

    const list = document.getElementById('pokemonList');
    const loader = document.getElementById('loadingIndicator');
    const pagin = document.getElementById('pagination');

    async function init() {
        fetchPokemonList();
        fetchAllMetadata();
        fetchAndPopulateTypes();
    }

    async function fetchAllMetadata() {
        try {
            const [pokes, moves] = await Promise.all([
                fetch(`${API}/pokemon?limit=2000`).then(r => r.json()),
                fetch(`${API}/move?limit=2000`).then(r => r.json())
            ]);
            allPokemonNames = pokes.results.map(p => p.name);
            allMoveNames = moves.results.map(m => m.name);
        } catch (e) { console.error(e); }
    }

    async function fetchAndPopulateTypes() {
        const res = await fetch(`${API}/type`);
        const data = await res.json();
        const container = document.getElementById('typeFilterDropdown');
        container.innerHTML = data.results
            .filter(t => t.name !== 'unknown' && t.name !== 'shadow')
            .map(type => `
                <label class="flex items-center gap-3 p-2 hover:bg-blue-50 rounded-xl cursor-pointer transition-colors group">
                    <input type="checkbox" value="${type.name}" class="type-checkbox w-5 h-5 rounded-md text-blue-600">
                    <span class="capitalize text-sm font-semibold text-gray-600 group-hover:text-blue-700">${type.name}</span>
                </label>
            `).join('');
    }

    async function fetchPokemonList(offset = 0) {
        currentOffset = offset;
        showLoading(true);
        list.innerHTML = '';
        pagin.classList.remove('hidden');

        try {
            const res = await fetch(`${API}/pokemon?offset=${offset}&limit=${LIMIT}`);
            const data = await res.json();
            document.getElementById('pageInfo').textContent = `Page ${Math.floor(offset/LIMIT) + 1}`;
            document.getElementById('prevBtn').disabled = !data.previous;
            document.getElementById('nextBtn').disabled = !data.next;

            const details = await Promise.all(data.results.map(p => fetch(p.url).then(r => r.json())));
            details.forEach(renderCard);
        } catch (e) { console.error(e); }
        showLoading(false);
    }

    function renderCard(pokemon) {
        const card = document.createElement('div');
        card.className = 'poke-card p-6 rounded-3xl flex flex-col items-center text-center border border-gray-100';
        const img = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;
        const types = pokemon.types.map(t => `<span class="type-pill type-${t.type.name}">${t.type.name}</span>`).join('');

        card.innerHTML = `
            <div class="bg-gray-50/50 rounded-2xl p-4 mb-4 w-full aspect-square flex items-center justify-center">
                <img src="${img}" class="w-full h-full object-contain" alt="${pokemon.name}">
            </div>
            <span class="text-xs font-black text-gray-400 tracking-widest mb-1">#${String(pokemon.id).padStart(3, '0')}</span>
            <h3 class="text-lg font-black capitalize mb-3 text-gray-800">${pokemon.name}</h3>
            <div class="flex flex-wrap justify-center">${types}</div>
        `;
        card.onclick = () => showDetails(pokemon);
        list.appendChild(card);
    }

    async function handleFilters() {
        const moveTerm = document.getElementById('moveSearchInput').value.toLowerCase().trim();
        const selectedTypes = Array.from(document.querySelectorAll('.type-checkbox:checked')).map(cb => cb.value);
        
        if (!moveTerm && selectedTypes.length === 0) {
            fetchPokemonList(0);
            return;
        }

        showLoading(true);
        list.innerHTML = '';
        pagin.classList.add('hidden');

        try {
            let urls = [];
            if (moveTerm) {
                const res = await fetch(`${API}/move/${moveTerm}`);
                const data = await res.json();
                urls = data.learned_by_pokemon.map(p => p.url);
            } else if (selectedTypes.length > 0) {
                const typeData = await Promise.all(selectedTypes.map(t => fetch(`${API}/type/${t}`).then(r => r.json())));
                const lists = typeData.map(d => d.pokemon.map(p => p.pokemon.url));
                urls = lists.reduce((a, b) => a.filter(url => b.includes(url)));
            }

            if (urls.length === 0) {
                list.innerHTML = `<div class="col-span-full py-20 text-center"><p class="text-xl font-bold text-white drop-shadow-md">No matches found in the tall grass...</p></div>`;
            } else {
                const results = await Promise.all(urls.slice(0, 30).map(url => fetch(url).then(r => r.json())));
                results.forEach(renderCard);
            }
        } catch (e) {
            list.innerHTML = `<div class="col-span-full py-20 text-center"><p class="text-red-500 font-bold bg-white/80 inline-block px-4 py-2 rounded-xl">Search failed. Try a different combination.</p></div>`;
        }
        showLoading(false);
    }

    function showDetails(pokemon) {
        const img = pokemon.sprites.other['official-artwork'].front_default;
        const stats = pokemon.stats.map(s => `
            <div class="mb-4">
                <div class="flex justify-between text-[10px] font-black mb-1 text-gray-400 uppercase">
                    <span>${s.stat.name.replace('-', ' ')}</span>
                    <span class="text-gray-900">${s.base_stat}</span>
                </div>
                <div class="stat-bar-bg"><div class="stat-bar bg-blue-500" data-width="${(s.base_stat/200)*100}%"></div></div>
            </div>
        `).join('');

        document.getElementById('modalBody').innerHTML = `
            <div class="bg-gradient-to-b from-blue-50 to-white p-10 flex justify-center">
                <img src="${img}" class="w-56 h-56 object-contain drop-shadow-2xl">
            </div>
            <div class="p-8">
                <div class="flex justify-between items-start mb-2">
                   <h2 class="text-4xl font-black capitalize text-gray-900">${pokemon.name}</h2>
                   <span class="text-lg font-black text-gray-200">#${String(pokemon.id).padStart(3, '0')}</span>
                </div>
                <div class="flex gap-2 mb-8">${pokemon.types.map(t => `<span class="type-pill type-${t.type.name}">${t.type.name}</span>`).join('')}</div>
                <div class="grid grid-cols-2 gap-8 mb-8 bg-gray-50 p-4 rounded-3xl">
                    <div class="text-center"><p class="text-gray-400 text-[10px] font-black uppercase mb-1">Height</p><p class="font-black text-gray-700">${pokemon.height/10}m</p></div>
                    <div class="text-center"><p class="text-gray-400 text-[10px] font-black uppercase mb-1">Weight</p><p class="font-black text-gray-700">${pokemon.weight/10}kg</p></div>
                </div>
                ${stats}
            </div>
        `;
        document.getElementById('modal').classList.remove('hidden');
        setTimeout(() => { document.querySelectorAll('.stat-bar').forEach(bar => bar.style.width = bar.dataset.width); }, 100);
    }

    function showLoading(show) { loader.classList.toggle('hidden', !show); }

    // Dropdown fix
    document.getElementById('typeFilterButton').onclick = (e) => {
        e.stopPropagation();
        document.getElementById('typeFilterDropdown').classList.toggle('hidden');
        document.getElementById('typeFilterArrow').classList.toggle('rotate-180');
    };

    document.getElementById('typeFilterDropdown').onclick = (e) => e.stopPropagation();

    document.getElementById('typeFilterDropdown').onchange = () => {
        const count = document.querySelectorAll('.type-checkbox:checked').length;
        document.getElementById('typeFilterButtonText').textContent = count ? `${count} Selected` : 'All Types';
        handleFilters();
    };

    window.onclick = (e) => {
        if (!document.getElementById('typeFilterContainer').contains(e.target)) {
            document.getElementById('typeFilterDropdown').classList.add('hidden');
            document.getElementById('typeFilterArrow').classList.remove('rotate-180');
        }
        document.getElementById('pokemonSuggestions').classList.add('hidden');
    };

    document.getElementById('nextBtn').onclick = () => fetchPokemonList(currentOffset + LIMIT);
    document.getElementById('prevBtn').onclick = () => fetchPokemonList(currentOffset - LIMIT);
    document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.add('hidden');
    document.getElementById('clearFiltersBtn').onclick = () => location.reload();

    // Search logic
    const pInput = document.getElementById('pokemonSearchInput');
    const pSug = document.getElementById('pokemonSuggestions');
    pInput.oninput = () => {
        const val = pInput.value.toLowerCase();
        if(!val) { pSug.classList.add('hidden'); return; }
        const matches = allPokemonNames.filter(n => n.startsWith(val)).slice(0, 10);
        pSug.innerHTML = matches.map(m => `<div class="suggestions-item">${m}</div>`).join('');
        pSug.classList.toggle('hidden', matches.length === 0);
    };

    pSug.onclick = async (e) => {
        if(e.target.classList.contains('suggestions-item')) {
            pInput.value = e.target.textContent;
            pSug.classList.add('hidden');
            showLoading(true);
            const res = await fetch(`${API}/pokemon/${pInput.value}`);
            const data = await res.json();
            list.innerHTML = '';
            renderCard(data);
            pagin.classList.add('hidden');
            showLoading(false);
        }
    };

    init();
</script>
</body>
</html>
